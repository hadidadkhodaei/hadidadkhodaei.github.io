<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>کانفیگ رایگان V2rayNG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      font-family: 'Vazirmatn', sans-serif;
      direction: rtl;
      overflow: hidden;
      background-color: #a80d0d;
      touch-action: none;
    }
    .splash, .main {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .splash {
      background: linear-gradient(to bottom,#a80d0d,#570000);
      color: #fff;
      animation: splashEnter 1.6s ease-out forwards;
      opacity: 0;
    }
    @keyframes splashEnter {
      0% {opacity: 0; transform: translateY(40px);}
      100% {opacity: 1; transform: translateY(0);}
    }
    .splash img.logo {
      width: 160px;
      margin-bottom: 20px;
    }
    .loader {
      width: 36px;
      height: 36px;
      border: 4px solid #888;
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% {transform: rotate(0);}
      100% {transform: rotate(360deg);}
    }
    .main {
      background: linear-gradient(#d71313, #800000);
      display: none;
      padding: 24px;
    }
    .card {
      background: #fffbc1;
      color: #333;
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,.2);
      width: 92%;
      max-width: 440px;
      padding: 24px;
      text-align: center;
      animation: fadeInUp 1s ease-out forwards;
      opacity: 0;
    }
    @keyframes fadeInUp {
      from {opacity: 0; transform: translateY(30px);}
      to   {opacity: 1; transform: translateY(0);}
    }
    h1 {
      font-size: 21px;
      margin-bottom: 10px;
      color: #1c3978;
    }
    p {
      font-size: 14px;
      margin-bottom: 16px;
    }
    .quote-box {
      background: #fff27a;
      border-left: 4px solid #a80d0d;
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
      cursor: pointer;
      margin-bottom: 16px;
      transition: all 0.3s ease;
    }
    .quote-box:hover {
      transform: scale(1.02);
      background: #ffe04d;
    }
    .quote-text {
      font-weight: 600;
      font-size: 15px;
      color: #1c3978;
    }
    .copied-msg {
      margin-top: 6px;
      font-size: 12px;
      color: #27a844;
      display: none;
    }
    .download-btn {
      display: inline-block;
      margin-top: 20px;
      background: linear-gradient(45deg,#1c3978,#3b66c5);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s ease;
    }
    .download-btn:hover {
      transform: scale(1.05);
    }
    #madeBy {
      margin-top: 10px;
      font-size: 13px;
      color: #555;
    }
    .footer {
      margin-top: 16px;
      font-size: 13px;
    }
    .footer a {
      color: #1c3978;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="splash" id="splash">
    <img src="https://hadidadkhodaei.ir/v2rayNG/Login.jpg" alt="هخامنشی" class="logo" />
    <div class="loader"></div>
  </div>

  <div class="main" id="main">
    <div class="card">
      <h1 class="title">📦 بارگذاری...</h1>
      <p class="description"></p>

      <div class="quote-box" id="quoteBox">
        <div class="quote-text"></div>
        <div id="copied" class="copied-msg">✅ لینک کپی شد!</div>
      </div>

      <a href="#" class="download-btn" id="apkDownload"></a>

      <div id="madeBy"></div>

      <div class="footer">
        <span class="footer-label"></span><a href="#" target="_blank"></a>
      </div>
    </div>
  </div>

  <script>
    let linkFull = "", visible = false;

    function toggleConfig() {
      const copied = document.getElementById('copied');
      visible = !visible;
      if (visible) {
        navigator.clipboard.writeText(linkFull).then(() => {
          copied.style.display = 'block';
          setTimeout(() => {
            copied.style.display = 'none';
            visible = false;
          }, 2500);
        });
      }
    }

    document.getElementById("quoteBox").addEventListener("click", toggleConfig);

    setTimeout(() => {
      document.getElementById("splash").style.display = "none";
      document.getElementById("main").style.display = "flex";

      fetch("V2ray.json")
        .then(res => res.json())
        .then(data => {
          document.querySelector(".title").textContent = "📦 " + data.title;
          document.querySelector(".description").textContent = data.description;
          document.querySelector(".quote-text").textContent = data.quoteLabel;
          linkFull = data.linkFull;

          const apkBtn = document.getElementById("apkDownload");
          apkBtn.textContent = "⬇️ " + data.downloadText;
          apkBtn.href = data.apkLink;

          document.querySelector(".footer-label").textContent = data.footerText;
          document.querySelector(".footer a").textContent = data.footerLinkText;
          document.querySelector(".footer a").href = data.footerLinkUrl;

          document.getElementById("madeBy").innerHTML =
            `${data.madeByText} <a href="${data.madeByLink}" target="_blank" style="color:#1c3978;font-weight:bold;text-decoration:none">${data.madeByName}</a>`;
        });
    }, 7000);
  </script>
</body>
</html>
