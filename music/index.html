<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>پلیر موزیک خودکار</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body {
      overflow-x: hidden;
      user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1e1e2f;
      margin: 0;
      padding: 40px;
      direction: rtl;
      color: #f0f0f0;
    }
    .music-list {
      max-width: 700px;
      margin: auto;
    }
    .music-item {
      background: linear-gradient(135deg, #2a2a3d, #1f1f2d);
      border-radius: 16px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.2), 0 4px 12px rgba(0,0,0,0.4);
      padding: 24px;
      margin-bottom: 30px;
    }
    .music-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .music-title-box {
      border: 2px solid #444;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 18px;
      font-weight: bold;
      background: #1e1e2f;
      color: #ffd966;
      flex: 1;
    }
    .music-title-box.rtl { text-align: right; direction: rtl; }
    .music-title-box.ltr { text-align: left; direction: ltr; }
    .music-ring {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top: 4px solid #ff6b6b;
      border-right: 4px solid #ffa94d;
      border-bottom: 4px solid #4ecdc4;
      border-left: 4px solid #5c7cfa;
      animation: spin 1.5s linear infinite;
    }
    .hidden-ring { visibility: hidden; }
    audio {
      width: 100%;
      margin-top: 20px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    .file-size {
      background: #3a3a4d;
      color: #ccc;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: fit-content;
      margin-top: 12px;
      direction: ltr;
      position: relative;
    }
    .file-size::before {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 12px;
      border: 6px solid transparent;
      border-top-color: #3a3a4d;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseShadow {
      0% { box-shadow: 0 0 20px #ff6b6b; }
      25% { box-shadow: 0 0 20px #ffa94d; }
      50% { box-shadow: 0 0 20px #4ecdc4; }
      75% { box-shadow: 0 0 20px #5c7cfa; }
      100% { box-shadow: 0 0 20px #ff6b6b; }
    }
    .active-shadow {
      animation: pulseShadow 3s infinite;
    }
  </style>
</head>
<body>

<div class="music-list" id="musicList">در حال بارگذاری موزیک‌ها...</div>

<script>
  const baseURL = 'https://hadidadkhodaei.ir/music/';
  const listURL = baseURL + 'list.php';
  const musicList = document.getElementById('musicList');
  const audioElements = [];

  function isPersian(text) {
    return /[\u0600-\u06FF]/.test(text);
  }

  function formatSize(bytes) {
    if (!bytes) return '';
    const mb = bytes / (1024 * 1024);
    return mb.toFixed(2) + ' MB';
  }

  async function getFileSize(url) {
    try {
      const response = await fetch(url, { method: 'HEAD' });
      const size = response.headers.get('Content-Length');
      return formatSize(size);
    } catch {
      return '';
    }
  }

  function extractFileName(url) {
    const parts = url.split('/');
    const file = parts[parts.length - 1];
    return decodeURIComponent(file.replace('.mp3', '').replace('.MP3', ''));
  }

  fetch(listURL)
    .then(res => res.json())
    .then(async files => {
      musicList.innerHTML = '';
      for (const file of files) {
        const fileUrl = baseURL + file;
        const title = extractFileName(fileUrl);
        const rtl = isPersian(title);

        const item = document.createElement('div');
        item.className = 'music-item';

        const header = document.createElement('div');
        header.className = 'music-header';

        const titleBox = document.createElement('div');
        titleBox.className = 'music-title-box';
        titleBox.textContent = title;
        titleBox.classList.add(rtl ? 'rtl' : 'ltr');

        const ring = document.createElement('div');
        ring.className = 'music-ring hidden-ring';

        if (rtl) {
          header.appendChild(titleBox);
          header.appendChild(ring);
        } else {
          header.appendChild(ring);
          header.appendChild(titleBox);
        }

        const audio = document.createElement('audio');
        audio.controls = true;
        audio.innerHTML = `<source src="${fileUrl}" type="audio/mpeg">`;

        const sizeDisplay = document.createElement('div');
        sizeDisplay.className = 'file-size';
        sizeDisplay.textContent = '';

        item.appendChild(header);
        item.appendChild(audio);
        item.appendChild(sizeDisplay);
        musicList.appendChild(item);

        audioElements.push(audio);

        audio.addEventListener('play', () => {
          audioElements.forEach(a => {
            if (a !== audio) a.pause();
          });
          item.classList.add('active-shadow');
          ring.classList.remove('hidden-ring');
        });

        audio.addEventListener('pause', () => {
          item.classList.remove('active-shadow');
          ring.classList.add('hidden-ring');
        });

        const sizeText = await getFileSize(fileUrl);
        sizeDisplay.textContent = sizeText;
      }
    })
    .catch(err => {
      musicList.innerHTML = 'خطا در دریافت لیست موزیک‌ها';
      console.error(err);
    });
</script>

</body>
</html>
