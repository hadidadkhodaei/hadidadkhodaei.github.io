<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گالری عکس هادی دادخدائی</title>
<link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet">
<style>
html, body {
  margin:0;
  padding:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
  font-family: 'Vazir', sans-serif;
  user-select: none;
  background:#000;
  transition: background 0.5s ease;
}

#lightbox {
  display: flex;
  position: fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  z-index: 9999;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

#lightbox img {
  max-width: 90%;
  max-height: 80vh;
  border-radius: 15px;
  position: absolute;
  box-shadow: 0 0 50px #ffffff;
  opacity: 0;
}

#lightbox img.active {
  opacity: 1;
}

#controls {
  position: fixed;
  top: 20px;
  width: 100%;
  display: flex;
  justify-content: flex-end;
  padding: 0 20px;
  z-index: 100;
}

#controls span {
  font-size: 45px;
  cursor: pointer;
  text-shadow: 0 0 10px #000;
}

#closeBtn {
  color: #ff4f4f;
  margin-right: 15px;
}

.lightbox-buttons {
  position: fixed;
  bottom: 20px;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 12px;
}

.lightbox-buttons span {
  font-size: 45px;
  cursor: pointer;
  padding: 15px 20px;
  border-radius: 12px;
  border: 3px solid;
}

.prev { border-color: #239f40; color: #239f40; }
.download-btn { border-color: #fff; color: #00ff00; }
.next { border-color: #d70000; color: #d70000; }

.lightbox-buttons span.disabled {
  opacity:0.3;
  pointer-events:none;
}
</style>
</head>
<body>

<div id="lightbox">
  <img id="imgEl" class="active">
  <div id="controls">
    <span id="closeBtn">&times;</span>
  </div>
  <div class="lightbox-buttons">
    <span class="prev" onclick="changeImage(-1)">&#10094;</span>
    <span class="download-btn" onclick="downloadCurrentImage()">&#8681;</span>
    <span class="next" onclick="changeImage(1)">&#10095;</span>
  </div>
</div>

<script>
let images = [];
let currentIndex = 0;
const imgEl = document.getElementById("imgEl");
const prevBtn = document.querySelector('.prev');
const nextBtn = document.querySelector('.next');
const downloadBtn = document.querySelector('.download-btn');
const closeBtn = document.getElementById('closeBtn');

closeBtn.onclick = () => window.location.href = "https://hadidadkhodaei.ir";

function setBackgroundColor(src){
  const img = new Image();
  img.crossOrigin = "Anonymous";
  img.src = src;
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img,0,0,1,1);
    const data = ctx.getImageData(0,0,1,1).data;
    document.body.style.background = `rgba(${data[0]},${data[1]},${data[2]},0.5)`;
  }
}

function updateButtons(){
  prevBtn.classList.toggle('disabled', currentIndex===0);
  nextBtn.classList.toggle('disabled', currentIndex===images.length-1);
}

function changeImage(dir){
  const nextIndex = currentIndex + dir;
  if(nextIndex < 0 || nextIndex >= images.length) return;
  currentIndex = nextIndex;
  imgEl.src = images[currentIndex];
  imgEl.classList.add('active');
  setBackgroundColor(images[currentIndex]);
  updateButtons();
}

function downloadCurrentImage(){
  const link = document.createElement('a');
  link.href = images[currentIndex];
  link.download = `image_${currentIndex+1}.jpg`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// بارگذاری عکس‌ها از فایل JSON
fetch("images.json")
  .then(response => response.json())
  .then(data => {
    images = data.map(item => item.src); // فرض بر اینه که JSON به شکل [{ "src": "url1" }, { "src": "url2" }, ...]
    if(images.length>0){
      imgEl.src = images[0];
      setBackgroundColor(images[0]);
      updateButtons();
    }
  })
  .catch(err => console.error("خطا در بارگذاری عکس‌ها:", err));
</script>

</body>
</html>
