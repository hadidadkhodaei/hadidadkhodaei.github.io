<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گالری عکس هادی دادخدائی</title>
<link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet">
<style>
html, body {
  margin:0;
  padding:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
  font-family: 'Vazir', sans-serif;
  user-select: none;
  background: #000;
}

#lightbox {
  display: flex;
  position: fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  z-index: 9999;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  overflow: hidden;
}

#lightbox img {
  max-width: 90%;
  max-height: 80vh;
  border-radius: 15px;
  pointer-events: none;
  box-shadow: 0 0 20px #fff;
  position: absolute;
}

#controls {
  position: fixed;
  top: 20px;
  width: 100%;
  display: flex;
  justify-content: flex-end;
  padding: 0 20px;
  z-index: 100;
}

#closeBtn {
  font-size: 45px;
  color: #ff4f4f;
  font-weight: bold;
  cursor: pointer;
}

.lightbox-buttons {
  position: fixed;
  bottom: 30px;
  display: flex;
  justify-content: center;
  gap: 20px;
  width: 100%;
  pointer-events: auto;
}

.lightbox-buttons span {
  font-size: 40px;
  cursor: pointer;
  padding: 15px 25px;
  border-radius: 10px;
  font-weight: bold;
  color: white;
}

.prev { background: linear-gradient(to bottom, #009900, #ffffff); } /* سبز به سفید */
.download-btn { background: linear-gradient(to bottom, #ffffff, #ff0000); } /* سفید به قرمز */
.next { background: linear-gradient(to bottom, #009900, #ffffff, #ff0000); } /* سبز-سفید-قرمز */

#gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  padding: 20px;
  gap: 20px;
  overflow-y: auto;
  height: 100vh;
}

.photo {
  position: relative;
  cursor: pointer;
  border-radius: 15px;
  box-shadow: 0 0 20px #fff;
  transition: transform 0.2s ease;
}

.photo img {
  width: 200px;
  height: 150px;
  object-fit: cover;
  border-radius: 15px;
}

.photo:hover {
  transform: scale(1.05);
}
</style>
</head>
<body>

<div id="gallery"></div>

<div id="lightbox">
  <img id="lightbox-img" src="">
  <div id="controls">
    <span id="closeBtn">&times;</span>
  </div>
  <div class="lightbox-buttons">
    <span class="prev" onclick="changeImage(-1)">&#10094;</span>
    <span class="download-btn" onclick="downloadCurrentImage()">&#8681;</span>
    <span class="next" onclick="changeImage(1)">&#10095;</span>
  </div>
</div>

<script>
let images = [];
let currentIndex = 0;

const gallery = document.getElementById("gallery");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const closeBtn = document.getElementById("closeBtn");

fetch('images.json')
  .then(res => res.json())
  .then(data => {
    images = data;
    images.forEach((img, idx) => {
      const div = document.createElement('div');
      div.classList.add('photo');
      const imageEl = document.createElement('img');
      imageEl.src = img.src;
      div.appendChild(imageEl);
      div.onclick = () => openLightbox(idx);
      gallery.appendChild(div);
    });
  });

function openLightbox(index) {
  currentIndex = index;
  lightbox.style.display = "flex";
  lightboxImg.src = images[currentIndex].src;
  setBackgroundColor(images[currentIndex].src);
  document.body.style.overflow = "hidden";
  updateButtons();
}

function closeLightbox() {
  lightbox.style.display = "none";
  document.body.style.overflow = "auto";
}

closeBtn.onclick = closeLightbox;

function changeImage(dir) {
  let next = currentIndex + dir;
  if(next<0 || next>=images.length) return;
  currentIndex = next;
  lightboxImg.src = images[currentIndex].src;
  setBackgroundColor(images[currentIndex].src);
  updateButtons();
}

function updateButtons() {
  document.querySelector('.prev').style.opacity = currentIndex===0?0.3:1;
  document.querySelector('.next').style.opacity = currentIndex===images.length-1?0.3:1;
}

function downloadCurrentImage() {
  const link = document.createElement('a');
  link.href = images[currentIndex].src;
  link.download = `image_${currentIndex+1}.jpg`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// تعیین رنگ بکگراند از عکس
function setBackgroundColor(src){
  const img = new Image();
  img.src = src;
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img,0,0,1,1);
    const data = ctx.getImageData(0,0,1,1).data;
    document.body.style.background = `rgba(${data[0]},${data[1]},${data[2]},0.4)`;
  }
}
</script>

</body>
</html>
