<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گالری هادی دادخدائی</title>
  <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Vazir', sans-serif;
      background: linear-gradient(135deg, #e0eafc, #cfdef3);
      overflow-x: hidden;
    }

    .photo-gallery-title {
      max-width: 800px;
      margin: 40px auto;
      padding: 25px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      color: #333;
      font-size: 2.2rem;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      position: relative;
      font-style: italic;
      border: 1px solid rgba(255,255,255,0.4);
    }
    .photo-gallery-title::before {
      content: "❝";
      font-size: 3rem;
      position: absolute;
      top: -15px;
      left: 20px;
      opacity: 0.3;
    }
    .photo-gallery-title::after {
      content: "❞";
      font-size: 3rem;
      position: absolute;
      bottom: -15px;
      right: 20px;
      opacity: 0.3;
    }

    .photo-gallery {
      padding: 20px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }
    .photo {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      animation: fadeInUp 0.7s ease;
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .photo:hover {
      transform: scale(1.03);
      box-shadow: 0 14px 30px rgba(0,0,0,0.3);
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 20px;
    }
    .photo-caption {
      text-align: center;
      padding-top: 8px;
      font-size: 16px;
      color: #444;
    }

    #lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
    }
    .lightbox-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }
    .lightbox-content {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }
    #lightbox img {
      width: auto;
      height: auto;
      max-width: 90%;
      max-height: 80vh;
      border-radius: 15px;
      transition: transform 0.4s ease;
    }
    #lightbox.show img {
      transform: scale(1.05);
    }
    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 40px;
      color: #ff3b3b;
      font-weight: bold;
      cursor: pointer;
    }
    .lightbox-caption {
      position: absolute;
      bottom: 20px;
      color: white;
      font-size: 18px;
      text-shadow: 0 0 5px black;
    }
    .prev, .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 40px;
      color: white;
      padding: 15px;
      cursor: pointer;
      background: rgba(0,0,0,0.4);
      border-radius: 50%;
    }
    .prev {left: 20px;}
    .next {right: 20px;}
  </style>
</head>
<body>

<section class="photo-gallery">
  <div class="photo-gallery-title">گالری هادی دادخدائی</div>
  <div class="gallery" id="gallery"></div>
</section>

<div id="lightbox">
  <div class="lightbox-overlay"></div>
  <div class="lightbox-content">
    <span class="close" onclick="closeLightbox()">&times;</span>
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-caption" id="lightbox-caption"></div>
    <span class="prev" onclick="changeImage(-1)">&#10094;</span>
    <span class="next" onclick="changeImage(1)">&#10095;</span>
  </div>
</div>

<script>
let images = [];
let currentImageIndex = 0;

function openLightbox(index) {
  document.getElementById("lightbox").style.display = "flex";
  document.getElementById("lightbox").classList.add("show");
  currentImageIndex = index;
  updateLightbox();
  document.body.style.overflow = "hidden"; 
}

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
  document.getElementById("lightbox").classList.remove("show");
  document.body.style.overflow = "auto";
}

function changeImage(direction) {
  let nextIndex = currentImageIndex + direction;
  if (nextIndex < 0 || nextIndex >= images.length) return;
  currentImageIndex = nextIndex;
  updateLightbox();
}

function updateLightbox() {
  document.getElementById("lightbox-img").src = images[currentImageIndex].src;
  document.getElementById("lightbox-caption").innerText = images[currentImageIndex].date;
  document.querySelector(".prev").style.display = (currentImageIndex === 0) ? "none" : "block";
  document.querySelector(".next").style.display = (currentImageIndex === images.length - 1) ? "none" : "block";
}

document.addEventListener("DOMContentLoaded", function() {
  fetch("images.json")
    .then(response => response.json())
    .then(data => {
      const gallery = document.getElementById("gallery");
      images = data;

      data.forEach((item, index) => {
        const photoDiv = document.createElement("div");
        photoDiv.classList.add("photo");

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = "تصویر " + (index + 1);
        img.loading = "lazy";
        photoDiv.appendChild(img);

        const caption = document.createElement("div");
        caption.classList.add("photo-caption");
        caption.innerText = item.date;
        photoDiv.appendChild(caption);

        photoDiv.onclick = () => openLightbox(index);

        gallery.appendChild(photoDiv);
      });
    })
    .catch(err => console.error("خطا در بارگذاری عکس‌ها:", err));
});
</script>

</body>
</html>
