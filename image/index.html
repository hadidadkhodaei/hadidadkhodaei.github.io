<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گالری هادی دادخدایی</title>
<style>
html, body {
  margin:0;
  padding:0;
  width:100vw;
  height:100vh;
  font-family: sans-serif;
  background: linear-gradient(135deg, #1a1a2e, #162447);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow:hidden;
  flex-direction: column;
}

/* تصویر */
#imgEl {
  max-width: 90%;
  max-height: 70vh;
  border-radius: 20px;
  box-shadow: 0 0 80px rgba(0,255,255,0.5), 0 0 150px rgba(255,0,255,0.35);
  object-fit: contain;
  opacity: 0;
  transition: opacity 0.4s ease;
  flex-shrink: 0;
}

#imgEl.active {
  opacity: 1;
}

/* دکمه‌ها پایین صفحه */
.lightbox-buttons {
  position: absolute;
  bottom: 30px;
  display: flex;
  justify-content: center;
  gap: 25px;
  width: 100%;
}

.lightbox-buttons span {
  width: 70px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  cursor: pointer;
  border-radius: 15px;
  border: 2px solid #6dd5ed; /* پیش‌فرض آبی */
  color: #6dd5ed;
  text-shadow: 0 0 15px #6dd5ed;
  transition: all 0.2s ease, box-shadow 0.2s ease;
  user-select: none;
}

/* دکمه دانلود سبز */
.lightbox-buttons span.download {
  border-color: #4CAF50;
  color: #4CAF50;
  text-shadow: 0 0 15px #4CAF50;
}

.lightbox-buttons span:hover {
  box-shadow: 0 0 30px #fff, 0 0 60px currentColor, 0 0 90px currentColor;
  transform: translateY(-4px) scale(1.1);
}

.lightbox-buttons span.disabled {
  opacity: 0.3;
  pointer-events: none;
}

/* responsive */
@media (max-width: 400px) {
  .lightbox-buttons span {
    width: 60px;
    height: 60px;
    font-size: 26px;
  }
}
</style>
</head>
<body>

<img id="imgEl" src="">

<div class="lightbox-buttons">
  <span class="prev">&#10094;</span>
  <span class="download">&#8681;</span>
  <span class="next">&#10095;</span>
</div>

<script>
let images = [];
let currentIndex = 0;

const imgEl = document.getElementById("imgEl");
const prevBtn = document.querySelector(".prev");
const nextBtn = document.querySelector(".next");
const downloadBtn = document.querySelector(".download");

function updateUI() {
  prevBtn.classList.toggle("disabled", currentIndex === 0);
  nextBtn.classList.toggle("disabled", currentIndex === images.length - 1);
}

function showImage(index) {
  imgEl.classList.remove("active");
  imgEl.src = images[index];
  imgEl.onload = () => {
    imgEl.classList.add("active");
    updateUI();
  };
}

prevBtn.onclick = () => { 
  if(currentIndex>0){ currentIndex--; showImage(currentIndex); } 
};
nextBtn.onclick = () => { 
  if(currentIndex<images.length-1){ currentIndex++; showImage(currentIndex); } 
};
downloadBtn.onclick = () => {
  const link = document.createElement("a");
  link.href = images[currentIndex];
  link.download = `image_${currentIndex+1}.jpg`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
};

// بارگذاری تصاویر از JSON
fetch("images.json")
  .then(res => res.json())
  .then(data => {
    images = data.map(item => item.src);
    if(images.length > 0) {
      showImage(0);
    }
  })
  .catch(err => console.error("خطا در بارگذاری تصاویر:", err));
</script>

</body>
</html>
