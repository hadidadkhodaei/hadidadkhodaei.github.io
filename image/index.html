<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title/>عکس هادی دادخدایی<title>
<link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet">
<style>
html, body {
  margin:0;
  padding:0;
  width:100vw;
  height:100vh;
  font-family: 'Vazir', sans-serif;
  overflow:hidden;
  background: linear-gradient(135deg, #1a1a2e, #162447);
  user-select: none; 
  -webkit-user-select: none;
  -ms-user-select: none;
  display: flex;
  justify-content: center;
  align-items: center;
  touch-action: manipulation; 
}

/* کادر اصلی */
#lightbox {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
  position: relative;
  box-sizing: border-box;
  overflow: hidden;
  padding: 10px;
}

/* تصویر با سایز واقعی همیشه وسط */
#lightbox img#imgEl {
  display: block;
  max-width: 90%;
  max-height: 65%; /* نسبت مناسب برای موبایل */
  border-radius: 20px;
  box-shadow: 0 0 40px rgba(0,255,255,0.2), 0 0 80px rgba(255,0,255,0.15);
  transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.4s ease;
  opacity: 0;
  transform: scale(0.95);
  object-fit: contain;
  pointer-events: none;
  margin: auto; /* همیشه وسط */
}

#lightbox img#imgEl.active {
  opacity: 1;
  transform: scale(1);
  box-shadow: 0 0 60px rgba(0,255,255,0.4), 0 0 100px rgba(255,0,255,0.3);
}

/* شماره‌گر زرد بالای صفحه سمت راست */
#imageCount {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 16px;
  color: #ffe066;
  font-weight: bold;
  background: rgba(0,0,0,0.3);
  padding: 4px 8px;
  border-radius: 8px;
  text-shadow: 0 0 5px #ffe066;
  user-select: none;
  z-index: 10;
}

/* دکمه‌های مربع پایین با رنگ‌های ملایم و glow */
.lightbox-buttons {
  position: absolute;
  bottom: 60px; /* فاصله از پایین تا داخل صفحه باشد */
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 20px;
  z-index: 10;
}

.lightbox-buttons span {
  width: 70px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  cursor: pointer;
  border-radius: 15px;
  border: 2px solid;
  transition: all 0.2s ease, box-shadow 0.2s ease;
  user-select: none;
  -webkit-user-select: none;
}

.prev { border-color: #6dd5ed; color: #6dd5ed; text-shadow: 0 0 10px #6dd5ed; }
.next { border-color: #6dd5ed; color: #6dd5ed; text-shadow: 0 0 10px #6dd5ed; }
.download-btn { border-color: #a8ff78; color: #a8ff78; text-shadow: 0 0 10px #a8ff78; }

.lightbox-buttons span:hover:not(.disabled) {
  box-shadow: 0 0 20px #fff, 0 0 40px currentColor, 0 0 60px currentColor;
  transform: translateY(-4px) scale(1.05);
}

.lightbox-buttons span.disabled {
  opacity:0.3;
  pointer-events:none;
}

/* responsive برای موبایل و تبلت */
@media (max-height: 700px) {
  #lightbox img#imgEl {
    max-height: 55%;
  }
  .lightbox-buttons {
    bottom: 40px;
  }
}

@media (max-width: 400px) {
  #lightbox img#imgEl {
    max-height: 50%;
  }
  .lightbox-buttons span {
    width: 60px;
    height: 60px;
    font-size: 26px;
  }
  .lightbox-buttons {
    bottom: 35px;
  }
}
</style>
</head>
<body>

<div id="lightbox">
  <img id="imgEl" class="active">

  <!-- شماره‌گر -->
  <span id="imageCount">0</span>

  <div class="lightbox-buttons">
    <span class="prev" onclick="changeImage(-1)">&#10094;</span>
    <span class="download-btn" onclick="downloadCurrentImage()">&#8681;</span>
    <span class="next" onclick="changeImage(1)">&#10095;</span>
  </div>
</div>

<script>
let images = [];
let currentIndex = 0;
const imgEl = document.getElementById("imgEl");
const prevBtn = document.querySelector('.prev');
const nextBtn = document.querySelector('.next');
const downloadBtn = document.querySelector('.download-btn');
const imageCount = document.getElementById('imageCount');

function setBackgroundColor(src){
  const img = new Image();
  img.crossOrigin = "Anonymous";
  img.src = src;
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img,0,0,1,1);
    const data = ctx.getImageData(0,0,1,1).data;
    document.body.style.background = `radial-gradient(circle at center, rgba(${data[0]},${data[1]},${data[2]},0.2) 0%, #1a1a2e 100%)`;
  }
}

function updateUI(){
  imageCount.textContent = `${currentIndex + 1} / ${images.length}`;
  prevBtn.classList.toggle('disabled', currentIndex === 0);
  nextBtn.classList.toggle('disabled', currentIndex === images.length - 1);
}

function changeImage(dir){
  const nextIndex = currentIndex + dir;
  if(nextIndex < 0 || nextIndex >= images.length) return;

  currentIndex = nextIndex;
  imgEl.classList.remove('active');
  void imgEl.offsetWidth;
  imgEl.src = images[currentIndex];
  imgEl.classList.add('active');
  setBackgroundColor(images[currentIndex]);
  updateUI();
}

function downloadCurrentImage(){
  const link = document.createElement('a');
  link.href = images[currentIndex];
  link.download = `image_${currentIndex+1}.jpg`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// بارگذاری تصاویر
fetch("images.json")
  .then(response => response.json())
  .then(data => {
    images = data.map(item => item.src);
    if(images.length>0){
      imgEl.src = images[0];
      imgEl.classList.add('active');
      setBackgroundColor(images[0]);
      updateUI();
    }
  })
  .catch(err => console.error("خطا در بارگذاری عکس‌ها:", err));
</script>

</body>
</html>
