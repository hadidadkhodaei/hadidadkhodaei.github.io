<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گالری عکس هادی دادخدائی</title>
<link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet">
<style>
html, body {
  margin:0;
  padding:0;
  width:100vw;
  height:100vh;
  font-family: 'Vazir', sans-serif;
  overflow:hidden;
  background: radial-gradient(circle at center, #0a0a0a 0%, #111 100%);
  user-select: none;
}

/* کادر اصلی */
#lightbox {
  display: flex;
  justify-content: center;
  align-items: center;
  width:100%;
  height:100%;
  position: relative;
}

/* تصویر */
#lightbox img#imgEl {
  max-width: 80%;
  max-height: 70vh;
  border-radius: 25px;
  box-shadow: 0 0 60px 20px rgba(0,255,255,0.4), 0 0 80px 25px rgba(255,0,255,0.3);
  transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.4s ease;
  opacity: 0;
  transform: scale(0.95);
  pointer-events: none;
}

#lightbox img#imgEl.active {
  opacity: 1;
  transform: scale(1);
  box-shadow: 0 0 80px 30px rgba(0,255,255,0.5), 0 0 100px 40px rgba(255,0,255,0.4);
}

/* ضربدر قرمز نئونی */
#closeBtn {
  position: absolute;
  top: 20px;
  left: 20px;
  cursor: pointer;
  color: #ff4f4f; 
  font-size: 36px;
  font-weight: bold;
  transition: transform 0.2s ease, text-shadow 0.2s ease;
  text-shadow: 0 0 10px #ff4f4f;
}

#closeBtn:hover {
  transform: scale(1.2);
  text-shadow: 0 0 20px #ff4f4f, 0 0 40px #ff0000;
}

/* شماره‌گر زرد نئونی بالای صفحه سمت راست */
#imageCount {
  position: absolute;
  top: 20px;
  right: 20px;
  font-size: 18px;
  color: #ffeb3b;
  font-weight: bold;
  background: rgba(0,0,0,0.3);
  padding: 5px 10px;
  border-radius: 8px;
  user-select: none;
  text-shadow: 0 0 5px #ffeb3b, 0 0 10px #ffeb3b;
  transition: all 0.2s ease;
}

/* دکمه‌های مربع پایین با glow */
.lightbox-buttons {
  position: absolute;
  bottom: 25px;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 25px;
}

.lightbox-buttons span {
  width: 60px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  cursor: pointer;
  border-radius: 15px;
  border: 2px solid;
  transition: all 0.2s ease, box-shadow 0.2s ease;
}

.prev { border-color: #00f0ff; color: #00f0ff; text-shadow: 0 0 15px #00f0ff; }
.next { border-color: #00f0ff; color: #00f0ff; text-shadow: 0 0 15px #00f0ff; }
.download-btn { border-color: #0fff5b; color: #0fff5b; text-shadow: 0 0 15px #0fff5b; }

.lightbox-buttons span:hover:not(.disabled) {
  box-shadow: 0 0 20px #fff, 0 0 40px currentColor, 0 0 60px currentColor;
  transform: translateY(-5px) scale(1.1);
}

.lightbox-buttons span.disabled {
  opacity:0.3;
  pointer-events:none;
}
</style>
</head>
<body>

<div id="lightbox">
  <img id="imgEl" class="active">
  
  <!-- ضربدر -->
  <div id="closeBtn">&times;</div>
  
  <!-- شماره‌گر -->
  <span id="imageCount">0</span>

  <div class="lightbox-buttons">
    <span class="prev" onclick="changeImage(-1)">&#10094;</span>
    <span class="download-btn" onclick="downloadCurrentImage()">&#8681;</span>
    <span class="next" onclick="changeImage(1)">&#10095;</span>
  </div>
</div>

<script>
let images = [];
let currentIndex = 0;
const imgEl = document.getElementById("imgEl");
const prevBtn = document.querySelector('.prev');
const nextBtn = document.querySelector('.next');
const downloadBtn = document.querySelector('.download-btn');
const closeBtn = document.getElementById('closeBtn');
const imageCount = document.getElementById('imageCount');

// ضربدر
closeBtn.onclick = () => window.history.back();

function setBackgroundColor(src){
  const img = new Image();
  img.crossOrigin = "Anonymous";
  img.src = src;
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img,0,0,1,1);
    const data = ctx.getImageData(0,0,1,1).data;
    document.body.style.background = `radial-gradient(circle at center, rgba(${data[0]},${data[1]},${data[2]},0.3) 0%, #0a0a0a 100%)`;
  }
}

// بروزرسانی شماره‌گر و دکمه‌ها
function updateUI(){
  imageCount.textContent = `${currentIndex + 1} / ${images.length}`;
  prevBtn.classList.toggle('disabled', currentIndex === 0);
  nextBtn.classList.toggle('disabled', currentIndex === images.length - 1);
}

// تغییر تصویر سریع و بدون باگ
function changeImage(dir){
  const nextIndex = currentIndex + dir;
  if(nextIndex < 0 || nextIndex >= images.length) return;

  currentIndex = nextIndex;
  imgEl.classList.remove('active');
  void imgEl.offsetWidth; // force reflow برای انیمیشن smooth
  imgEl.src = images[currentIndex];
  imgEl.classList.add('active');
  setBackgroundColor(images[currentIndex]);
  updateUI();
}

function downloadCurrentImage(){
  const link = document.createElement('a');
  link.href = images[currentIndex];
  link.download = `image_${currentIndex+1}.jpg`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// بارگذاری تصاویر
fetch("images.json")
  .then(response => response.json())
  .then(data => {
    images = data.map(item => item.src);
    if(images.length>0){
      imgEl.src = images[0];
      imgEl.classList.add('active');
      setBackgroundColor(images[0]);
      updateUI();
    }
  })
  .catch(err => console.error("خطا در بارگذاری عکس‌ها:", err));
</script>

</body>
</html>
